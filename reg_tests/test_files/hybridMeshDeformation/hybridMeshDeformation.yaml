Simulations:
  - name: sim1
    time_integrator: ti_1
    optimizer: opt1

linear_solvers:
  - name: solve_scalar
    type: tpetra
    method: gmres
    preconditioner: sgs
    tolerance: 1e-12
    max_iterations: 75
    kspace: 75
    output_level: 0

    # solver for the pressure Poisson equation
  - name: solve_cont
    type: tpetra
    method: gmres
    preconditioner: muelu
    tolerance: 1e-12
    max_iterations: 75
    kspace: 75
    output_level: 0
    recompute_preconditioner: no
    muelu_xml_file_name: ../../xml/milestone.xml

realms:
  - name: realm_1
    mesh: ../../mesh/hybrid_block.g
    automatic_decomposition_type: rcb
    use_edges: yes

    equation_systems:
      name: theEqSys
      max_iterations: 5

      solver_system_specification:
        velocity: solve_scalar
        pressure: solve_cont
        enthalpy: solve_scalar

      systems:
        - LowMachEOM:
            name: myLowMach
            max_iterations: 1
            decoupled_pressure_solve: yes
            num_pressure_correctors: 3
            convergence_tolerance: 1e-8

        - Enthalpy:
            name: myEnth
            max_iterations: 1
            convergence_tolerance: 1.0e-5

    material_properties:
      target_name: [block_1, block_2, block_3, block_4]
      constant_specification:
        universal_gas_constant: 8314.4621
        reference_pressure: 101325.0

      reference_quantities:
        - species_name: Air
          mw: 29.0
          mass_fraction: 1.0

      specifications:
        - name: density
          type: constant
          value: 1.178037722969475

        - name: viscosity
          type: constant
          value: 1.2E-5

        - name: specific_heat
          type: constant
          value: 1000.0

    initial_conditions:
      - constant: ic_1
        target_name:
          - all_blocks
        value:
          pressure: 0
          velocity: [1.0, 0.0, 0.0]
          temperature: 300

    boundary_conditions:
      - inflow_boundary_condition: bc_inflow
        target_name: surface_1
        inflow_user_data:
          velocity: [1.0, 0.0, 0.0]
          temperature: 300

      - inflow_boundary_condition: bc_inflow
        target_name: surface_2
        inflow_user_data:
          velocity: [1.0, 0.0, 0.0]
          temperature: 300

      - open_boundary_condition: bc_open
        target_name: surface_3
        open_user_data:
          velocity: [0.0, 0.0, 0.0]
          pressure: 0.0
          temperature: 300

    mesh_motion:
      - name: pulsate
        mesh_parts: [block_1, block_2, block_3, block_4]
        frame: non_inertial
        motion:
          - type: deforming_interior
            xyz_min: [-1.25, -0.25, -0.75]
            xyz_max: [1.25, 0.25, 0.75]
            amplitude: [0.01, 0.01, 0.01] # 0.2 results in some inverted elements
            frequency: [0.5, 0.5, 0.5]
            centroid: [0, 0, 0]

    solution_options:
      name: myOptions
      turbulence_model: laminar
      projected_timescale_type: momentum_diag_inv

      options:
        - source_terms:
            continuity: [density_time_derivative, gcl]
        - hybrid_factor:
            velocity: 1.0
            enthalpy: 1.0

        - laminar_prandtl:
            enthalpy: 0.7

        - alpha_upw:
            velocity: 1.0
            enthalpy: 1.0

        - upw_factor:
            velocity: 0.0
            enthalpy: 0.0

        - noc_correction:
            pressure: yes
            velocity: yes
            enthalpy: yes

        - limiter:
            pressure: no
            velocity: yes
            enthalpy: yes

        - projected_nodal_gradient:
            velocity: element
            pressure: element
            enthalpy: element

        - relaxation_factor:
            velocity: 0.7
            pressure: 0.3
            enthalpy: 0.7

    output:
      output_data_base_name: mesh_motion_interior_deformation.exo
      output_frequency: 1
      output_node_set: no
      output_variables:
        - velocity
        - pressure
        - element_courant
        - iblank
        - iblank_cell
        - mesh_displacement
        - dual_nodal_volume
        - div_mesh_velocity
        - mesh_velocity
        - div_mdot
        - continuity_residual
        - temperature

Time_Integrators:
  - StandardTimeIntegrator:
      name: ti_1
      start_time: 0
      termination_time: 5
      time_step: 0.1
      time_stepping_type: fixed
      time_step_count: 0
      second_order_accuracy: yes
      nonlinear_iterations: 1

      realms:
        - realm_1
